# Session setup for the test-beam sandbox.
# Edit the values below, then run: scripts/setup_session.sh check FILE
# Lines starting with # are comments. Items left out take the default shown in
# docs/setup-file.md. Device sections are [alpide N] (reference planes) and
# [msensor N] (synthetic DUT); N counts from 0 for each kind without gaps.

[run]
# events per run (NEVENTS) before RunControl starts the next run; the finite
#   example (--example) ends with its source instead; integer from 1 to
#   1000000000
events = 60000

[beam]
# beam particle; the session core simulates electrons only; one of: e-
particle = e-
# kinetic energy in GeV; number from 3 to 6
energy_gev = 4
# nominal beam centre x, y and source z in mm; the session varies x and y
#   privately by up to 0.1 mm; 3 comma-separated numbers from -10000 to 10000
position_mm = 1.1, -2.1, -20
# nominal variance of the beam position in x and y (sigma squared, mm2); 2
#   comma-separated numbers from 1e-06 to 10000
spread_mm2 = 25, 25
# nominal particle rate in Hz; the session adds up to 20 Hz privately; number
#   from 1 to 1000
rate_hz = 220

[positions]
# the actual device positions differ from the positions in this file by up to
#   this much in x and in y, as after mounting; the offsets stay hidden and
#   are found by alignment; 0 switches them off; number from 0 to 10
offset_max_mm = 5
# another number draws another set of offsets for the same devices; integer
#   from 0 to 1000000
offset_draw = 0

[alpide 0]
# EUDAQ plane number, unique across all devices; integer from 0 to 63
plane = 0
# x, y, z of the sensor centre in mm; z is along the beam; 3 comma-separated
#   numbers from -10000 to 10000
position_mm = 1, -2, 0
# pixel pitch in micrometres; 2 comma-separated numbers from 1 to 1000
pitch_um = 30, 30
# columns, rows; the public ALPIDE producer requires 1024, 512; 2 comma-
#   separated integers from 1 to 4096
pixels = 1024, 512
# ITHR threshold DAC; higher values lower the virtual efficiency and cluster
#   size; integer from 0 to 255
ithr = 0
# STROBE_LENGTH in 25 ns ticks (readout gate); integer from 1 to 4000
strobe_length = 40

# Same items as the first [alpide N] section above.
[alpide 1]
plane = 1
position_mm = 1, -2, 20
pitch_um = 30, 30
pixels = 1024, 512
ithr = 0
strobe_length = 40

# Same items as the first [alpide N] section above.
[alpide 2]
plane = 2
position_mm = 1, -2, 40
pitch_um = 30, 30
pixels = 1024, 512
ithr = 0
strobe_length = 40

# Same items as the first [alpide N] section above.
[alpide 3]
plane = 3
position_mm = 1, -2, 80
pitch_um = 30, 30
pixels = 1024, 512
ithr = 0
strobe_length = 40

# Same items as the first [alpide N] section above.
[alpide 4]
plane = 4
position_mm = 1, -2, 100
pitch_um = 30, 30
pixels = 1024, 512
ithr = 0
strobe_length = 40

# Same items as the first [alpide N] section above.
[alpide 5]
plane = 5
position_mm = 1, -2, 120
pitch_um = 30, 30
pixels = 1024, 512
ithr = 0
strobe_length = 40

[msensor 0]
# EUDAQ plane number, unique across all devices; integer from 0 to 63
plane = 6
# x, y, z of the sensor centre in mm; z is along the beam; 3 comma-separated
#   numbers from -10000 to 10000
position_mm = 1, -2, 60
# pixel pitch in micrometres (x, y); 2 comma-separated numbers from 1 to 1000
pitch_um = 22.8, 20.8
# tile grid: tiles along x, tiles along y; tiles are numbered from 0 starting
#   at column 0, row 0, along x first; 2 comma-separated integers from 1 to 64
tiles = 6, 2
# pixels of one tile: columns, rows; 2 comma-separated integers from 1 to 4096
tile_pixels = 156, 444
# tile numbers that are switched off (no hits, no noise); empty for none;
#   empty, or comma-separated integers from 0 to 4095
tiles_off =
# threshold DAC, one value for all tiles or one per tile in tile order; higher
#   values lower the efficiency; one or more comma-separated integers from 0
#   to 255
threshold_dac = 100
# readout mode; one of: continuous, triggered
readout = continuous
# continuous readout window in ns; integer from 1000 to 10000000
window_length_ns = 1000000

[scintillator 0]
# trigger board input channel; integer from 0 to 3
channel = 0
# plate centre x, y, z in mm; 3 comma-separated numbers from -10000 to 10000
position_mm = 1.1, -2.1, -10
# plate shape; one of: rectangle, disc
shape = rectangle
# plate width and height, or disc diameter in mm; one or more comma-separated
#   numbers from 1 to 200
size_mm = 30, 20
# central hole width and height, or diameter in mm; 0 means none; one or more
#   comma-separated numbers from 0 to 200
hole_mm = 0, 0

[scintillator 1]
# trigger board input channel; integer from 0 to 3
channel = 3
# plate centre x, y, z in mm; 3 comma-separated numbers from -10000 to 10000
position_mm = 1.1, -2.1, 140
# plate shape; one of: rectangle, disc
shape = rectangle
# plate width and height, or disc diameter in mm; one or more comma-separated
#   numbers from 1 to 200
size_mm = 30, 20
# central hole width and height, or diameter in mm; 0 means none; one or more
#   comma-separated numbers from 0 to 200
hole_mm = 0, 0

[trigger]
# condition that makes a trigger; an expression of trg0 to trg3, bsy and
#   comparisons of dt_trg, dt_veto or ntrg, joined with &, | and !
trg = trg0&trg3&dt_trg>10000&dt_veto>5000&!bsy
# condition that blocks triggers; empty disables veto; an expression of trg0
#   to trg3, bsy and comparisons of dt_trg, dt_veto or ntrg, joined with &, |
#   and !
veto = ntrg>0
# conditions the board counts; one to sixteen groups of four characters 0, 1,
#   x or R, for inputs 3 to 0 from left to right
count = 1xxR Rxx1 xxxR Rxxx
