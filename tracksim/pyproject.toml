[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracksim"
version = "0.1.0"
description = "Modular particle transport and empirical pixel-detector readout"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tracksim = "tracksim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
